# Coleta automática do TI Sem Fronteiras (agendada + manual).
# Segredo necessário: FIREBASE_SERVICE_ACCOUNT (conteúdo JSON da chave de serviço).
# Confira as versões das ações (checkout, setup-python, upload-artifact) antes do uso.
name: Coleta automática de dados

on:
  schedule:
    - cron: "0 6 * * 1"        # toda segunda-feira, 06:00 UTC
  workflow_dispatch:
    inputs:
      fonte:
        description: "Fonte a coletar"
        type: choice
        options: [todas, banco_mundial, arbeitnow]
        default: todas

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-coletor.txt

      - name: Instalar dependências
        run: pip install -r requirements-coletor.txt

      - name: Testes (offline)
        run: python -m unittest discover -s tests -v

      - name: Coletar e publicar no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m coletor.executar --fonte "${{ github.event.inputs.fonte || 'todas' }}" --publicar

      - name: Guardar os relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-coleta
          path: saida/
          if-no-files-found: ignore
